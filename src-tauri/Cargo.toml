[package]
name = "corestart-reach"
version = "0.3.0"
edition = "2024"
description = "Open-source RDP and SSH connection manager"
license = "GPL-3.0-only"
repository = "https://github.com/ThePoolboy/corestart-reach"
homepage = "https://www.corestart.network"
rust-version = "1.85"

[dependencies]
argon2 = "0.6.0"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
open = "5.4.4"
russh = { version = "0.63.3", default-features = false, features = ["ring", "flate2", "rsa"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.12.0", features = [] }
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-single-instance = "2"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt", "sync", "time", "macros", "io-util", "net"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
zeroize = "1.9.0"

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

# Already used by Tauri on Linux; Reach only needs it to name its windows.
[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.18"

# Self-update from GitHub Releases. Windows only: Flatpak updates the Linux version.
[target."cfg(windows)".dependencies]
tauri-plugin-updater = "2"
windows = { version = "0.62.2", features = ["Win32_Security_Credentials", "Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }

# Argon2 is painfully slow unoptimised; keep unlocking fast in dev builds too.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
strip = true
