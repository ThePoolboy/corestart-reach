# Flatpak build of Corestart Reach, with FreeRDP built in.
#
#   flatpak run org.flatpak.Builder --user --install --force-clean \
#     build-flatpak flatpak/io.github.thepoolboy.corestart-reach.yml
#
# The build runs offline, as Flathub requires: every Rust crate and npm package
# is listed in cargo-sources.json and node-sources.json. Regenerate them after
# changing Cargo.lock or package-lock.json (see flatpak/README.md).
id: io.github.thepoolboy.corestart-reach
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node24
command: corestart-reach

finish-args:
  - --share=ipc
  - --share=network        # RDP and SSH connections
  - --socket=wayland       # Reach's windows and the RDP window (FreeRDP's SDL3 client)
  - --socket=fallback-x11  # the same on X11 desktops
  - --device=dri           # GPU drawing for the interface and the RDP window
  - --socket=pulseaudio    # sound from the remote desktop
  - --socket=ssh-auth      # your ssh-agent
  - --filesystem=~/.ssh    # SSH keys and known_hosts, shared with OpenSSH

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/man
  - "*.a"
  - "*.la"

modules:
  # The RDP client. Only what Reach uses: the SDL3 client (native Wayland, X11
  # fallback), clipboard, sound and auto-reconnect. No server parts, and no
  # codecs the runtime can't provide.
  - name: freerdp
    buildsystem: cmake-ninja
    builddir: true # FreeRDP refuses to build inside its source tree
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DUSE_VERSION_FROM_GIT_TAG=OFF
      - -DWITH_CLIENT_SDL=ON
      - -DWITH_CLIENT_SDL3=ON
      - -DWITH_CLIENT_SDL2=OFF
      - -DWITH_X11=OFF
      - -DWITH_WAYLAND=OFF
      - -DWITH_SERVER=OFF
      - -DWITH_SHADOW=OFF
      - -DWITH_PROXY=OFF
      - -DWITH_PLATFORM_SERVER=OFF
      - -DWITH_SAMPLE=OFF
      - -DWITH_WINPR_TOOLS=OFF
      - -DWITH_MANPAGES=OFF
      - -DWITH_CCACHE=OFF
      - -DWITH_VERBOSE_WINPR_ASSERT=OFF
      # Sound through PulseAudio (PipeWire provides it on modern desktops).
      - -DWITH_PULSE=ON
      - -DWITH_ALSA=OFF
      - -DWITH_OSS=OFF
      # NTLM login needs RC4 and MD4, which OpenSSL 3 no longer provides by default.
      - -DWITH_INTERNAL_RC4=ON
      - -DWITH_INTERNAL_MD4=ON
      - -DWITH_INTERNAL_MD5=ON
      # Not available in the runtime, or not used by Reach.
      - -DWITH_FFMPEG=OFF
      - -DWITH_DSP_FFMPEG=OFF
      - -DWITH_VIDEO_FFMPEG=OFF
      - -DWITH_SWSCALE=OFF
      - -DWITH_OPENH264=OFF
      - -DWITH_CUPS=OFF
      - -DWITH_PCSC=OFF
      - -DWITH_SMARTCARD_PCSC=OFF
      - -DWITH_PKCS11=OFF
      - -DWITH_FUSE=OFF
      - -DWITH_KRB5=OFF
      - -DWITH_JSON_DISABLED=ON
      - -DWITH_AAD=OFF
      - -DWITH_URIPARSER=OFF
      - -DWITH_SYSTEMD=OFF
      - -DCHANNEL_URBDRC=OFF
    sources:
      - type: archive
        url: https://github.com/FreeRDP/FreeRDP/releases/download/3.32.1/freerdp-3.32.1.tar.gz
        sha256: 3021cf8848efbd0064664e187cb61e6101e4e74a4d8ffb495d9f7715e22d67de
        x-checker-data:
          type: json
          url: https://api.github.com/repos/FreeRDP/FreeRDP/releases/latest
          version-query: .tag_name
          url-query: '"https://github.com/FreeRDP/FreeRDP/releases/download/" + $version + "/freerdp-" + $version + ".tar.gz"'

  - name: corestart-reach
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node24/bin
      env:
        CARGO_HOME: /run/build/corestart-reach/cargo
        CARGO_NET_OFFLINE: "true"
        CARGO_TERM_COLOR: never
        XDG_CACHE_HOME: /run/build/corestart-reach/flatpak-node/cache
        npm_config_cache: /run/build/corestart-reach/flatpak-node/npm-cache
        npm_config_offline: "true"
    build-commands:
      - npm ci --offline --no-audit --no-fund
      - npm run build
      # tauri/custom-protocol serves the built interface from inside the binary
      # (what `tauri build` does), instead of the dev server.
      - cargo build --release --offline --locked --features tauri/custom-protocol --manifest-path src-tauri/Cargo.toml
      - install -Dm755 src-tauri/target/release/corestart-reach /app/bin/corestart-reach
      - install -Dm644 flatpak/io.github.thepoolboy.corestart-reach.desktop /app/share/applications/io.github.thepoolboy.corestart-reach.desktop
      - install -Dm644 flatpak/io.github.thepoolboy.corestart-reach.metainfo.xml /app/share/metainfo/io.github.thepoolboy.corestart-reach.metainfo.xml
      - install -Dm644 assets/icon.svg /app/share/icons/hicolor/scalable/apps/io.github.thepoolboy.corestart-reach.svg
      - install -Dm644 src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/io.github.thepoolboy.corestart-reach.png
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/io.github.thepoolboy.corestart-reach.png
      - install -Dm644 src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/io.github.thepoolboy.corestart-reach.png
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - node_modules
          - dist
          - src-tauri/target
          - src-tauri/gen
          - build-flatpak
          - .flatpak-builder
      - cargo-sources.json
      - node-sources.json
