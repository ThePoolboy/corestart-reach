# Checks the code and builds the two things we ship, on every push:
#   - the Flatpak (all Linux distributions)
#   - the Windows installer (setup.exe)
# Both are attached to each run under "Artifacts" (kept 30 days).
#
# Pushing a version tag (git tag v0.1.0 && git push origin v0.1.0) also creates
# a DRAFT GitHub Release with both files attached. Nothing is public until you
# open the draft on GitHub and press Publish.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Version tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          pkg=$(jq -r .version package.json)
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          meta=$(grep -o '<release version="[^"]*"' flatpak/io.github.thepoolboy.corestart-reach.metainfo.xml | head -1 | cut -d'"' -f2)
          echo "tag=$tag tauri.conf=$conf package.json=$pkg Cargo.toml=$cargo metainfo=$meta"
          [ "$tag" = "$conf" ] && [ "$tag" = "$pkg" ] && [ "$tag" = "$cargo" ] && [ "$tag" = "$meta" ]

      - name: Install WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libwebkit2gtk-4.1-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - run: npm ci

      - name: Check the interface
        run: npm run check

      - name: Audit dependencies for known vulnerabilities
        run: |
          npm audit --omit=dev
          cd src-tauri && cargo audit

      - name: Lint and test the Rust core
        working-directory: src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Lint and test the Rust core on Windows
        working-directory: src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Build setup.exe
        run: npm run tauri build -- --bundles nsis

      # "Corestart Reach_0.1.0_x64-setup.exe" -> "Corestart-Reach_0.1.0_x64-setup.exe"
      - name: Remove spaces from the file name
        shell: bash
        run: |
          cd src-tauri/target/release/bundle/nsis
          for f in *.exe; do [[ "$f" == *" "* ]] && mv "$f" "${f// /-}"; done
          ls -l

      - uses: actions/upload-artifact@v7
        with:
          name: corestart-reach-windows
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30

  flatpak:
    name: Flatpak
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      # Builds offline, like Flathub, from flatpak/*-sources.json.
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/io.github.thepoolboy.corestart-reach.yml
          bundle: corestart-reach.flatpak
          artifact-name: corestart-reach-flatpak
          cache-key: flatpak-builder-${{ hashFiles('flatpak/io.github.thepoolboy.corestart-reach.yml') }}

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, windows, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github

      - uses: actions/download-artifact@v8
        with:
          path: downloads
          merge-multiple: true

      - name: Create a draft release with both downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mv downloads/corestart-reach.flatpak "downloads/Corestart-Reach_${version}_x86_64.flatpak"
          ls -l downloads
          # GitHub's generated notes, then the "Support Reach" footer.
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" \
            --jq .body > notes.md
          cat .github/release-support.md >> notes.md
          gh release create "$GITHUB_REF_NAME" downloads/* \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Corestart Reach $version" --notes-file notes.md
