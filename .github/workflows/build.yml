# Checks the code and builds the two things we ship, on every push:
#   - the Flatpak (all Linux distributions)
#   - the Windows installer (setup.exe)
# Both are attached to each run under "Artifacts" (kept 30 days).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libwebkit2gtk-4.1-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Check the interface
        run: npm run check

      - name: Lint and test the Rust core
        working-directory: src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Lint and test the Rust core on Windows
        working-directory: src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Build setup.exe
        run: npm run tauri build -- --bundles nsis

      # "Corestart Reach_0.1.0_x64-setup.exe" -> "Corestart-Reach_0.1.0_x64-setup.exe"
      - name: Remove spaces from the file name
        shell: bash
        run: |
          cd src-tauri/target/release/bundle/nsis
          for f in *.exe; do [[ "$f" == *" "* ]] && mv "$f" "${f// /-}"; done
          ls -l

      - uses: actions/upload-artifact@v7
        with:
          name: corestart-reach-windows
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30

  flatpak:
    name: Flatpak
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/network.corestart.reach.yml
          bundle: corestart-reach.flatpak
          artifact-name: corestart-reach-flatpak
          cache-key: flatpak-builder-${{ hashFiles('flatpak/network.corestart.reach.yml') }}
